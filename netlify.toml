# Netlify build settings.
#
# The Next.js plugin below is what makes the API routes work — the order form
# and the admin panel both need a server, so a plain static export would break
# them. Netlify installs the plugin automatically when it detects Next.js, but
# pinning it here means the build doesn't depend on that detection.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Long-lived caching for the fingerprinted bundles. Their filenames change
# whenever the contents do, so they can never go stale.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep the admin out of search engines. It's password-protected either way,
# but there's no reason for it to be indexed.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
